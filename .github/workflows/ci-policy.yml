name: CI security policy

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test ci/*.test.cjs
      - run: python3 -m unittest discover -s ci -p 'test_check_maven_dependencies.py'
      - run: python3 -m unittest discover -s ci -p 'test_fork_unit_tests.py'
      - run: python3 ci/check_maven_dependencies.py tmail-backend
