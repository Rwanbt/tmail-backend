name: JMAP / Apache James real Maven smoke

on:
  pull_request:
    paths:
      - '.github/workflows/jmap-memory-smoke.yml'
      - 'tmail-backend/**'
      - 'james-project'
      - 'pom.xml'
      - '.gitmodules'
      - 'ci/verify_jmap_surefire.py'
      - 'ci/test_verify_jmap_surefire.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-jmap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify immutable Apache James checkout
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git ls-tree HEAD james-project | awk '{print $3}')
          actual=$(git -C james-project rev-parse HEAD)
          test -n "$expected" && test "$expected" = "$actual"
          echo "Apache James exact commit: $actual"
          java -version
          mvn -version
      - name: Reject duplicate Maven dependencies before reactor resolution
        run: |
          python3 -m unittest discover -s ci -p 'test_check_maven_dependencies.py'
          python3 ci/check_maven_dependencies.py tmail-backend
          python3 -m unittest discover -s ci -p 'test_verify_jmap_surefire.py'
      - name: Execute real in-memory JMAP email, mailbox, ACL, auth, send and blob suites
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -pl :memory-jmap-integration-tests,:jmap-extensions -am \
            -Dtest=MemoryEmailGetMethodTest,MemoryEmailSetMethodTest,MemoryEmailSubmissionSetMethodTest,MemoryMailboxSetMethodTest,MemoryWebPushDisabledTest,MemoryWebSocketTransportDisabledTest,MemoryWebSocketTransportEnabledTest,MemoryTeamMailboxMemberSetMethodTest,MemoryTicketAuthenticationTest,MemoryUnauthenticatedBlobAccessSetMethodTest,MemoryLinagoraEmailSendMethodTest,MemoryUploadFromUrlTest,EmailSendQueueCleanupTest,EmailSendFailureSanitizationTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test
      - name: Confirm JMAP test methods genuinely executed
        shell: bash
        run: |
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/integration-tests/jmap/memory-jmap-integration-tests/target/surefire-reports \
            MemoryEmailGetMethodTest \
            MemoryEmailSetMethodTest \
            MemoryEmailSubmissionSetMethodTest \
            MemoryMailboxSetMethodTest \
            MemoryWebPushDisabledTest \
            MemoryWebSocketTransportDisabledTest \
            MemoryWebSocketTransportEnabledTest \
            MemoryTeamMailboxMemberSetMethodTest \
            MemoryTicketAuthenticationTest \
            MemoryUnauthenticatedBlobAccessSetMethodTest \
            MemoryLinagoraEmailSendMethodTest \
            MemoryUploadFromUrlTest \
            --require MemoryEmailGetMethodTest:emailGetShouldFailWhenWrongAccountId \
            --require MemoryEmailGetMethodTest:shouldBeAbleToDownloadAttachmentBaseOnFastViewWithAttachmentsMetadataResult \
            --require MemoryEmailSetMethodTest:emailSetShouldSucceedWhenInvalidToMailAddressAndHaveDraftKeyword \
            --require MemoryEmailSetMethodTest:createShouldAddAnEmailInTargetMailbox \
            --require MemoryEmailSetMethodTest:createShouldFailWhenAttachmentDoesNotBelongToUser \
            --require MemoryEmailSetMethodTest:createShouldFailWhenInsertRightIsRemovedByANegativeAclEntry \
            --require MemoryMailboxSetMethodTest:webSocketShouldPushNewMessageWhenChangeSubscriptionOfMailbox \
            --require MemoryWebPushDisabledTest:pushListenerShouldNotBeRegistered \
            --require MemoryWebPushDisabledTest:pushSubscriptionGetShouldBeRejected \
            --require MemoryWebPushDisabledTest:pushSubscriptionSetShouldBeRejected \
            --require MemoryWebSocketTransportDisabledTest:disabledWebSocketDoesNotDisableAuthenticatedJmapHttp \
            --require MemoryWebSocketTransportEnabledTest:enabledWebSocketAcceptsAuthenticatedUpgrade \
            --require MemoryWebSocketTransportEnabledTest:enabledWebSocketRejectsUnauthenticatedUpgrade \
            --require MemoryLinagoraEmailSendMethodTest:emailSendShouldSendMailSuccessfully \
            --require MemoryLinagoraEmailSendMethodTest:emailSendShouldSupportAttachment \
            --require MemoryLinagoraEmailSendMethodTest:emailSendShouldNotCreatedWhenEnvelopAbsentAndEmailSetDoNotHaveHeader \
            --require MemoryLinagoraEmailSendMethodTest:emailSendShouldNotAppendWhenEnvelopeSenderIsUnauthorized \
            --require MemoryLinagoraEmailSendMethodTest:rejectedQueueSubmissionMustNotKeepAnOrphanEmail \
            --require MemoryLinagoraEmailSendMethodTest:methodShouldRejectOtherAccountIds \
            --require MemoryUploadFromUrlTest:shouldImportRemoteFileAsAUsableJmapAttachment \
            --require MemoryUploadFromUrlTest:shouldNeverForwardJmapCredentialsToRemoteFileServer \
            --require MemoryUploadFromUrlTest:shouldNotFollowRemoteRedirectEvenWhenTargetIsOnAllowedHost \
            --require MemoryUploadFromUrlTest:shouldReturnInternalServerErrorWhenRemoteReturnsNonSuccess \
            --require MemoryUploadFromUrlTest:shouldRejectSourceOutsideAllowedSources \
            --require MemoryUploadFromUrlTest:uploadFromUrlShouldRejectUnauthenticatedRequest \
            --require MemoryUploadFromUrlTest:shouldRejectUploadToNonDelegatedAccount
      - name: Confirm reactive mail cleanup ran on success, failure and cancellation
        run: |
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/jmap/extensions/target/surefire-reports \
            com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldReleaseMailAfterSuccessfulEnqueue \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldReleaseMailWhenEnqueueFails \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldReleaseMailWhenEnqueueIsCancelled \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldNotReportAnAcceptedMailAsFailedWhenCleanupThrows \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldKeepTheEnqueueFailureWhenCleanupAlsoThrows
      - name: Require JMAP error redaction under a real Maven test
        run: |
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/jmap/extensions/target/surefire-reports \
            com.linagora.tmail.james.jmap.model.EmailSendFailureSanitizationTest \
            --require com.linagora.tmail.james.jmap.model.EmailSendFailureSanitizationTest:internalQueueFailureMustNotExposeCredentialsOrInfrastructureDetails \
            --require com.linagora.tmail.james.jmap.model.EmailSendFailureSanitizationTest:missingSenderStillReturnsTheActionableValidationDescription
      - name: Preserve real Maven test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-jmap-surefire
          path: tmail-backend/integration-tests/jmap/memory-jmap-integration-tests/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
