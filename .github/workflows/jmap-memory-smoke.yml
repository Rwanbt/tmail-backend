name: JMAP / Apache James real Maven smoke

on:
  pull_request:
    paths:
      - '.github/workflows/jmap-memory-smoke.yml'
      - 'tmail-backend/**'
      - 'james-project'
      - 'pom.xml'
      - '.gitmodules'
      - 'ci/verify_jmap_surefire.py'
      - 'ci/test_verify_jmap_surefire.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-jmap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify immutable Apache James checkout
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git ls-tree HEAD james-project | awk '{print $3}')
          actual=$(git -C james-project rev-parse HEAD)
          test -n "$expected" && test "$expected" = "$actual"
          echo "Apache James exact commit: $actual"
          java -version
          mvn -version
      - name: Reject duplicate Maven dependencies before reactor resolution
        run: |
          python3 -m unittest discover -s ci -p 'test_check_maven_dependencies.py'
          python3 ci/check_maven_dependencies.py tmail-backend
          python3 -m unittest discover -s ci -p 'test_verify_jmap_surefire.py'
          python3 -m unittest discover -s ci -p 'test_verify_james_ssrf_surefire.py'
      - name: Execute real in-memory JMAP email, mailbox, ACL, auth, send and blob suites
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -pl :memory-jmap-integration-tests,:jmap-extensions -am \
            -Dtest=MemoryEmailGetMethodTest,MemoryEmailSetMethodTest,MemoryEmailSubmissionSetMethodTest,MemoryMailboxSetMethodTest,MemoryWebPushDisabledTest,MemoryWebSocketTransportDisabledTest,MemoryWebSocketTransportEnabledTest,MemoryTeamMailboxMemberSetMethodTest,MemoryTicketAuthenticationTest,MemoryUnauthenticatedBlobAccessSetMethodTest,MemoryLinagoraEmailSendMethodTest,MemoryUploadFromUrlTest,EmailSendQueueCleanupTest,EmailSendFailureSanitizationTest,EmailSendPrepublicationFailureTest,EmailSendIdempotencyTest,EmailSendOutboxStateTest,SsrfRemoteUrlValidatorTest,SSRFValidatorTest,AllowedRemoteSourceTest,RemoteUrlPolicyTest,UploadFromUrlConfigurationTest,BoundedRemoteContentDecompressorTest,RemoteUrlForLoggingTest,UploadFromUrlCapabilityTest,TicketManagerTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test
      - name: Confirm JMAP test methods genuinely executed
        shell: bash
        run: |
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/integration-tests/jmap/memory-jmap-integration-tests/target/surefire-reports \
            MemoryEmailGetMethodTest \
            MemoryEmailSetMethodTest \
            MemoryEmailSubmissionSetMethodTest \
            MemoryMailboxSetMethodTest \
            MemoryWebPushDisabledTest \
            MemoryWebSocketTransportDisabledTest \
            MemoryWebSocketTransportEnabledTest \
            MemoryTeamMailboxMemberSetMethodTest \
            MemoryTicketAuthenticationTest \
            MemoryUnauthenticatedBlobAccessSetMethodTest \
            MemoryLinagoraEmailSendMethodTest \
            MemoryUploadFromUrlTest \
            --require MemoryEmailGetMethodTest:emailGetShouldFailWhenWrongAccountId \
            --require MemoryEmailGetMethodTest:shouldBeAbleToDownloadAttachmentBaseOnFastViewWithAttachmentsMetadataResult \
            --require MemoryEmailSetMethodTest:emailSetShouldSucceedWhenInvalidToMailAddressAndHaveDraftKeyword \
            --require MemoryEmailSetMethodTest:createShouldAddAnEmailInTargetMailbox \
            --require MemoryEmailSetMethodTest:createShouldFailWhenAttachmentDoesNotBelongToUser \
            --require MemoryEmailSetMethodTest:createShouldFailWhenInsertRightIsRemovedByANegativeAclEntry \
            --require MemoryMailboxSetMethodTest:webSocketShouldPushNewMessageWhenChangeSubscriptionOfMailbox \
            --require MemoryWebPushDisabledTest:pushListenerShouldNotBeRegistered \
            --require MemoryWebPushDisabledTest:pushSubscriptionGetShouldBeRejected \
            --require MemoryWebPushDisabledTest:pushSubscriptionSetShouldBeRejected \
            --require MemoryWebSocketTransportDisabledTest:disabledWebSocketDoesNotDisableAuthenticatedJmapHttp \
            --require MemoryWebSocketTransportEnabledTest:enabledWebSocketAcceptsAuthenticatedUpgrade \
            --require MemoryWebSocketTransportEnabledTest:enabledWebSocketRejectsUnauthenticatedUpgrade \
            --require MemoryLinagoraEmailSendMethodTest:emailSendShouldSendMailSuccessfully \
            --require MemoryLinagoraEmailSendMethodTest:emailSendShouldSupportAttachment \
            --require MemoryLinagoraEmailSendMethodTest:emailSendShouldNotCreatedWhenEnvelopAbsentAndEmailSetDoNotHaveHeader \
            --require MemoryLinagoraEmailSendMethodTest:emailSendShouldNotAppendWhenEnvelopeSenderIsUnauthorized \
            --require MemoryLinagoraEmailSendMethodTest:rejectedQueueSubmissionMustNotKeepAnOrphanEmail \
            --require MemoryLinagoraEmailSendMethodTest:lostQueueAcknowledgementMustNotDeleteAnAcceptedEmail \
            --require MemoryLinagoraEmailSendMethodTest:enqueueFailureWithoutAcceptanceProofMustPreserveSenderCopy \
            --require MemoryLinagoraEmailSendMethodTest:methodShouldRejectOtherAccountIds \
            --require MemoryUploadFromUrlTest:shouldImportRemoteFileAsAUsableJmapAttachment \
            --require MemoryUploadFromUrlTest:shouldNeverForwardJmapCredentialsToRemoteFileServer \
            --require MemoryUploadFromUrlTest:shouldNotFollowRemoteRedirectEvenWhenTargetIsOnAllowedHost \
            --require MemoryUploadFromUrlTest:shouldReturnInternalServerErrorWhenRemoteReturnsNonSuccess \
            --require MemoryUploadFromUrlTest:shouldRejectSourceOutsideAllowedSources \
            --require MemoryUploadFromUrlTest:uploadFromUrlShouldRejectUnauthenticatedRequest \
            --require MemoryUploadFromUrlTest:shouldRejectUploadToNonDelegatedAccount
      - name: Confirm reactive mail cleanup ran on success, failure and cancellation
        run: |
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/jmap/extensions/target/surefire-reports \
            com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldReleaseMailAfterSuccessfulEnqueue \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldReleaseMailWhenEnqueueFails \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldReleaseMailWhenEnqueueIsCancelled \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldNotReportAnAcceptedMailAsFailedWhenCleanupThrows \
            --require com.linagora.tmail.james.jmap.method.EmailSendQueueCleanupTest:shouldKeepTheEnqueueFailureWhenCleanupAlsoThrows
      - name: Verify only proven pre-publication failures permit cleanup
        run: |
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/jmap/extensions/target/surefire-reports \
            com.linagora.tmail.james.jmap.method.EmailSendPrepublicationFailureTest \
            --require com.linagora.tmail.james.jmap.method.EmailSendPrepublicationFailureTest:synchronousBlobFailureIsProvablyBeforePublication \
            --require com.linagora.tmail.james.jmap.method.EmailSendPrepublicationFailureTest:arbitraryQueueFailureNeverProvesRejection \
            --require com.linagora.tmail.james.jmap.method.EmailSendPrepublicationFailureTest:failedCompensationNeverMasksTheUncertainSendOutcome \
            --require com.linagora.tmail.james.jmap.method.EmailSendPrepublicationFailureTest:emptyCompensationResultNeverSilentlyCompletesAnUncertainSend
      - name: Require JMAP error redaction under a real Maven test
        run: |
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/jmap/extensions/target/surefire-reports \
            com.linagora.tmail.james.jmap.model.EmailSendFailureSanitizationTest \
            --require com.linagora.tmail.james.jmap.model.EmailSendFailureSanitizationTest:internalQueueFailureMustNotExposeCredentialsOrInfrastructureDetails \
            --require com.linagora.tmail.james.jmap.model.EmailSendFailureSanitizationTest:missingSenderStillReturnsTheActionableValidationDescription \
            --require com.linagora.tmail.james.jmap.model.EmailSendFailureSanitizationTest:ambiguousQueueAcceptanceWarnsAgainstRetriesWithoutExposingBrokerSecrets
      - name: Require idempotency fingerprints and conservative outbox safety transitions
        run: |
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/jmap/extensions/target/surefire-reports \
            com.linagora.tmail.james.jmap.model.EmailSendIdempotencyTest \
            com.linagora.tmail.james.jmap.model.EmailSendOutboxStateTest \
            --require com.linagora.tmail.james.jmap.model.EmailSendIdempotencyTest:stableForSameAccountKeyAndPayload \
            --require com.linagora.tmail.james.jmap.model.EmailSendIdempotencyTest:accountScopeAndLengthBoundariesAreUnambiguous \
            --require com.linagora.tmail.james.jmap.model.EmailSendIdempotencyTest:detectsConflictingPayloadForSameRetryKey \
            --require com.linagora.tmail.james.jmap.model.EmailSendIdempotencyTest:rejectsMissingScopeOrKey \
            --require com.linagora.tmail.james.jmap.model.EmailSendOutboxStateTest:onlyOneOwnerMayClaimPreparedSubmission \
            --require com.linagora.tmail.james.jmap.model.EmailSendOutboxStateTest:onlyOwnerMayAcknowledgeOrMarkUncertain \
            --require com.linagora.tmail.james.jmap.model.EmailSendOutboxStateTest:restartAndLostAcknowledgementNeverAuthorizeResend \
            --require com.linagora.tmail.james.jmap.model.EmailSendOutboxStateTest:provenRejectionCannotBeInferredOnceDispatchStarted
      - name: Require the SSRF address policy to be executed, not assumed
        shell: bash
        run: |
          # The production SSRF entry point: private IPv4/IPv6 ranges, the IPv6
          # cloud metadata endpoint, IPv4-mapped IPv6 and the alternative IPv4
          # notations are refused by the real resolver.
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/jmap/extensions/target/surefire-reports \
            com.linagora.tmail.james.jmap.upload.SsrfRemoteUrlValidatorTest \
            --require com.linagora.tmail.james.jmap.upload.SsrfRemoteUrlValidatorTest:shouldRejectEveryAddressReachingTheLocalNetwork \
            --require com.linagora.tmail.james.jmap.upload.SsrfRemoteUrlValidatorTest:shouldAcceptAPublicAddress
          # The upload-from-URL policy, the log redaction and the JMAP ticket
          # lifecycle suites exist in the production module but are not
          # selected by any other gate: they must be executed, not assumed.
          python3 ci/verify_jmap_surefire.py \
            tmail-backend/jmap/extensions/target/surefire-reports \
            com.linagora.tmail.james.jmap.upload.AllowedRemoteSourceTest \
            com.linagora.tmail.james.jmap.upload.RemoteUrlPolicyTest \
            com.linagora.tmail.james.jmap.upload.UploadFromUrlConfigurationTest \
            com.linagora.tmail.james.jmap.upload.BoundedRemoteContentDecompressorTest \
            com.linagora.tmail.james.jmap.upload.RemoteUrlForLoggingTest \
            com.linagora.tmail.james.jmap.method.UploadFromUrlCapabilityTest \
            com.linagora.tmail.james.jmap.ticket.TicketManagerTest \
            --require com.linagora.tmail.james.jmap.upload.AllowedRemoteSourceTest:shouldRejectPercentEncodingInConfiguredHost \
            --require com.linagora.tmail.james.jmap.upload.AllowedRemoteSourceTest:shouldRejectUserInfoInConfiguredSource \
            --require com.linagora.tmail.james.jmap.upload.RemoteUrlPolicyTest:shouldSelectSsrfModeWithoutSources \
            --require com.linagora.tmail.james.jmap.upload.RemoteUrlPolicyTest:shouldRejectNonStandardPortInSsrfMode \
            --require com.linagora.tmail.james.jmap.upload.UploadFromUrlConfigurationTest:shouldBeDisabledByDefault \
            --require com.linagora.tmail.james.jmap.upload.UploadFromUrlConfigurationTest:shouldRejectTrustAllSourceSslCertificatesWithoutAllowedSources \
            --require com.linagora.tmail.james.jmap.upload.BoundedRemoteContentDecompressorTest:shouldCapMaximumAllocationToIntegerRange \
            --require com.linagora.tmail.james.jmap.upload.RemoteUrlForLoggingTest:shouldRemoveCredentialsAndFragment \
            --require com.linagora.tmail.james.jmap.method.UploadFromUrlCapabilityTest:shouldOmitAllowedSourcesWhenUsingDynamicSsrfPolicy \
            --require com.linagora.tmail.james.jmap.ticket.TicketManagerTest:ticketShouldBeScopedBySourceIpByDefault \
            --require com.linagora.tmail.james.jmap.ticket.TicketManagerTest:ticketShouldExpire \
            --require com.linagora.tmail.james.jmap.ticket.TicketManagerTest:ticketCanBeRevoked \
            --require com.linagora.tmail.james.jmap.ticket.TicketManagerTest:ticketShouldBeSingleUse
          # The pinned Apache James policy suite: DNS rebinding, multi record
          # resolution and IPv4-mapped IPv6 held as an IPv6 address.
          python3 ci/verify_james_ssrf_surefire.py \
            james-project/server/protocols/jmap-rfc-8621/target/surefire-reports
      - name: Preserve real Maven test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-jmap-surefire
          path: tmail-backend/integration-tests/jmap/memory-jmap-integration-tests/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
