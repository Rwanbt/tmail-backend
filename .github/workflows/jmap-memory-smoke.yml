name: JMAP / Apache James real Maven smoke

on:
  pull_request:
    paths:
      - '.github/workflows/jmap-memory-smoke.yml'
      - 'tmail-backend/integration-tests/jmap/**'
      - 'pom.xml'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-jmap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify immutable Apache James checkout
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git ls-tree HEAD james-project | awk '{print $3}')
          actual=$(git -C james-project rev-parse HEAD)
          test -n "$expected" && test "$expected" = "$actual"
          echo "Apache James exact commit: $actual"
          java -version
          mvn -version
      - name: Execute real in-memory JMAP Email/get suite
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -pl :memory-jmap-integration-tests -am \
            -Dtest=MemoryEmailGetMethodTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test
      - name: Confirm JMAP test methods genuinely executed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          location = Path('tmail-backend/integration-tests/jmap/memory-jmap-integration-tests/target/surefire-reports')
          reports = list(location.glob('*MemoryEmailGetMethodTest*.xml'))
          assert reports, f'No executed JMAP Email/get Surefire XML in {location}'
          tests = failures = errors = skipped = 0
          for report in reports:
              node = ET.parse(report).getroot()
              tests += int(node.get('tests', 0))
              failures += int(node.get('failures', 0))
              errors += int(node.get('errors', 0))
              skipped += int(node.get('skipped', 0))
          assert tests > skipped, f'No test methods actually executed: {tests=} {skipped=}'
          assert not failures and not errors, f'JMAP suite failed: {failures=} {errors=}'
          print(f'PASS: {tests-skipped} real JMAP Email/get test methods; {skipped} skipped')
          PY
      - name: Preserve real Maven test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-jmap-surefire
          path: tmail-backend/integration-tests/jmap/memory-jmap-integration-tests/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
