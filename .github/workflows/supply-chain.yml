name: Supply chain

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '41 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vulnerability-secret-and-misconfiguration-scan:
    name: Vulnerabilities, secrets and misconfigurations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The Apache James submodule is pinned and owned upstream; it is scanned in
      # its own repository. Every other dependency of this repository is in scope.
      - name: Scan the repository
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          # A vulnerability with no fixed version cannot be remediated by a
          # dependency bump, so it must not block the pipeline forever. It stays
          # visible in the report artifact.
          ignore-unfixed: true
          exit-code: '1'
          report-format: table
          output: trivy-report.txt
          upload-artifact: true
          artifact-name: trivy-report

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate the CycloneDX and SPDX bills of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-cyclonedx
      - name: Generate the SPDX bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx
      - name: Record the SBOM digest
        run: |
          {
            echo "## Software bill of materials"
            echo ""
            echo "| Format | File | SHA256 |"
            echo "|---|---|---|"
            for file in sbom.cdx.json sbom.spdx.json; do
              if [ -f "${file}" ]; then
                echo "| ${file} | \`${file}\` | \`$(sha256sum "${file}" | cut -d' ' -f1)\` |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  provenance:
    name: Attested provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [sbom]
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download the CycloneDX bill of materials
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-cyclonedx
          path: attest
      - name: Attest the provenance of the bill of materials
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: attest/sbom.cdx.json
