name: Create PR to update James submodule

on:
  schedule:
    - cron: '1 */4 * * *'
  workflow_dispatch:

# Updating the gitlink and opening a review PR are the only write effects.
permissions:
  contents: write
  pull-requests: write

jobs:
  createPullRequest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check if submodule is updated
        id: check-submodule
        run: |
          # The checked-out source stays at the exact workflow trigger SHA.
          # This workflow proposes a new Apache James gitlink; it never rebases
          # or silently executes a newer TMail checkout than the reviewed one.
          git submodule update --remote
          git config user.name 'github[bot]'
          git config user.email 'github-bot@linagora.com'
          if [ "$(git diff --submodule=log)" != "" ]; then
            echo "Submodule has changes"
            git add james-project
            echo "changed=yes" >> $GITHUB_OUTPUT
          else
            echo "No changes in submodule"
            echo "changed=no" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request to Upstream if submodule updated
        if: ${{ steps.check-submodule.outputs.changed == 'yes' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: Update James SHA-1
          title: "Update James submodule to latest version"
          body: |
            This pull request updates the James SHA-1 submodule to the latest version.
          branch: upgradeSha1
          base: master
          labels: bot
          delete-branch: true
