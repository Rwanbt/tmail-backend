name: Report pending Apache James submodule update

on:
  schedule:
    - cron: '1 */4 * * *'
  workflow_dispatch:

# Read-only by design.
#
# Updating the Apache James submodule and opening the pull request that carries
# that update are MANUAL operations owned by the maintainer, performed outside
# CI. This workflow therefore only REPORTS the drift between the pinned gitlink
# and the remote head.
#
# It must never open a pull request, never push a branch and never grant the
# workflow token a pull-request scope. The file name is kept for continuity
# with the existing schedule; the previous automatic pull request behaviour was
# removed on purpose.
permissions:
  contents: read

jobs:
  reportPendingSubmoduleUpdate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Compare the pinned Apache James commit with the remote head
        id: check-submodule
        run: |
          # The checked-out source stays at the exact workflow trigger SHA.
          # This workflow only REPORTS the drift; it never rebases or silently
          # executes a newer TMail checkout than the reviewed one.
          pinned=$(git ls-tree HEAD james-project | awk '{print $3}')
          git submodule update --remote james-project
          remote_head=$(git -C james-project rev-parse HEAD)
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          echo "remote-head=${remote_head}" >> "$GITHUB_OUTPUT"
          if [ "${pinned}" = "${remote_head}" ]; then
            echo "The pinned Apache James commit is up to date."
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "fast-forward=yes" >> "$GITHUB_OUTPUT"
          else
            # The pinned Apache James commit carries the validated RabbitMQ
            # publisher-acknowledgement loss fix. Only a descendant of the
            # pinned commit may ever be proposed: a diverged remote head
            # would silently drop that fix from the backend runtime.
            if git -C james-project fetch --depth=200 origin master; then
              echo "Apache James history deepened to check the pinned ancestry"
            else
              echo "::warning::Cannot deepen the Apache James history; the ancestry cannot be proven."
            fi
            if git -C james-project merge-base --is-ancestor "${pinned}" "${remote_head}"; then
              echo "An Apache James update is available and descends from the pinned commit."
              echo "changed=yes" >> "$GITHUB_OUTPUT"
              echo "fast-forward=yes" >> "$GITHUB_OUTPUT"
            else
              echo "The Apache James remote head does not descend from the pinned commit."
              echo "changed=yes" >> "$GITHUB_OUTPUT"
              echo "fast-forward=no" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Report the pending Apache James update
        env:
          PINNED: ${{ steps.check-submodule.outputs.pinned }}
          REMOTE_HEAD: ${{ steps.check-submodule.outputs.remote-head }}
          FAST_FORWARD: ${{ steps.check-submodule.outputs.fast-forward }}
        run: |
          MANUAL_NOTICE="The Apache James submodule update and its pull request are managed manually by the maintainer; this workflow never opens a pull request."
          {
            echo "## Apache James submodule update pending"
            echo ""
            echo "- pinned commit: \`${PINNED}\`"
            echo "- remote head: \`${REMOTE_HEAD}\`"
            echo "- descends from the pinned commit: ${FAST_FORWARD}"
            echo ""
            echo "${MANUAL_NOTICE}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Apache James submodule update pending::pinned=${PINNED} remote-head=${REMOTE_HEAD} fast-forward=${FAST_FORWARD} - the update and its pull request are managed manually by the maintainer"
